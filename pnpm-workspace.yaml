# pnpm settings. This repository is a single package, so no workspace is
# defined here.
#
# A dependency allowed to run install scripts is declared under `allowBuilds`
# as a `<package>: true` entry, never as a list item: pnpm skips install
# scripts by default, and approving them from inside a workflow would make the
# build depend on a side effect. No dependency declares one yet.
allowBuilds: {}
